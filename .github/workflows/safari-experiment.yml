name: Safari window close experiment

on:
  push:
    branches: [exp/safari-window-close]

permissions:
  contents: read

jobs:
  safari:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read WPT revision
        id: wpt
        run: echo "revision=$(cat wpt/revision.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: web-platform-tests/wpt
          ref: ${{ steps.wpt.outputs.revision }}
          path: .reference/wpt
          persist-credentials: false
          sparse-checkout: |
            common
            docs
            interfaces
            resources
            tools
            webmcp
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Configure Safari
        run: |
          sudo safaridriver --enable
          python .reference/wpt/wpt make-hosts-file | sudo tee -a /etc/hosts
          mkdir -p wpt-results
          cd .reference/wpt/webmcp/declarative
          for name in execute_tool_change_event execute_tool_submit_from_js select-multiple-events executeTool-pseudo-classes; do
            sed 's|action="about:blank"|action="/common/blank.html"|' "$name.https.html" > "$name-network.https.html"
            grep -c 'action="/common/blank.html"' "$name-network.https.html"
          done
      - name: C - upstream declarative tests with a network action, with the polyfill
        continue-on-error: true
        timeout-minutes: 10
        run: >-
          experiment/run.sh polyfill
          webmcp/declarative/execute_tool_change_event-network.https.html
          webmcp/declarative/execute_tool_submit_from_js-network.https.html
          webmcp/declarative/select-multiple-events-network.https.html
          webmcp/declarative/executeTool-pseudo-classes-network.https.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: safari-experiment
          path: wpt-results/
          retention-days: 7
